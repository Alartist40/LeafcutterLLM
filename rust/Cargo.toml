[package]
name = "leafcutter"
version = "0.9.0"
edition = "2021"
authors = ["THE-PATHFINDER-EYE Team"]
description = "Memory-safe LLM inference engine with layer streaming and K-quant support"
license = "MIT"

[lib]
name = "leafcutter"
path = "src/lib.rs"

[[bin]]
name = "leafcutter"
path = "src/main.rs"

[[bin]]
name = "split_model"
path = "src/bin/split_model.rs"

[[bin]]
name = "diagnose_models"
path = "src/bin/diagnose_models.rs"

[[bin]]
name = "list_tensors"
path = "src/bin/list_tensors.rs"

[[bin]]
name = "check_meta"
path = "src/bin/check_meta.rs"

[[bin]]
name = "check_shapes"
path = "src/bin/check_shapes.rs"

[[bin]]
name = "ref_full"
path = "src/bin/ref_full.rs"

[[bin]]
name = "test_llama_ffi"
path = "src/bin/test_llama_ffi.rs"

[[bin]]
name = "test_generation"
path = "src/bin/test_generation.rs"

[[bin]]
name = "test_llama"
path = "src/bin/test_llama.rs"

[[bin]]
name = "scan_corruption"
path = "src/bin/scan_corruption.rs"

[[bin]]
name = "ref_layers"
path = "src/bin/ref_layers.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.4", features = ["util"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
memmap2 = "0.9"
half = "2.4"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
bytes = "1.5"
uuid = { version = "1.6", features = ["v4"] }
clap = { version = "4.5", features = ["derive"] }
rand = "0.8"
rayon = "1.10"
tokenizers = { version = "0.23.1", default-features = false, features = ["fancy-regex"] }
wgpu = "29.0.3"
pollster = "0.4.0"
bytemuck = "1.25.0"
ureq = { version = "2", features = ["json"] }
which = "7.0"
libc = "0.2"
shellexpand = "3.1"
hex = "0.4.3"

[features]
default = []
openblas = []
llama-ffi = []

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3"
