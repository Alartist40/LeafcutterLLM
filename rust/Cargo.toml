[package]
name = "leafcutter"
version = "0.9.0"
edition = "2021"
authors = ["THE-PATHFINDER-EYE Team"]
description = "Memory-safe LLM inference engine with layer streaming and K-quant support"
license = "MIT"

[lib]
name = "leafcutter"
path = "src/lib.rs"

[[bin]]
name = "leafcutter"
path = "src/main.rs"

[[bin]]
name = "benchmark_models"
path = "src/bin/benchmark_models.rs"

[[bin]]
name = "comprehensive_diagnostic"
path = "src/bin/comprehensive_diagnostic.rs"

[[bin]]
name = "inspect_ornith"
path = "src/bin/inspect_ornith.rs"

[[bin]]
name = "test_generation"
path = "src/bin/test_generation.rs"

[[bin]]
name = "probe_3d"
path = "src/bin/probe_3d.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower = { version = "0.4", features = ["util"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
memmap2 = "0.9"
half = "2.4"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
bytes = "1.5"
uuid = { version = "1.6", features = ["v4"] }
clap = { version = "4.5", features = ["derive"] }
rand = "0.8"
rayon = "1.10"
tokenizers = { version = "0.23.1", default-features = false, features = ["fancy-regex"] }
wgpu = "29.0.3"
pollster = "0.4.0"
bytemuck = "1.25.0"
ureq = { version = "2", features = ["json"] }
colored = "2.1"
which = "7.0"
libc = "0.2"
shellexpand = "3.1"
hex = "0.4.3"
matrixmultiply = "0.3"

[features]
default = []
openblas = []
llama-ffi = []

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3"
